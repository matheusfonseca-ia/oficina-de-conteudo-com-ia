<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,"><title>Escritório de Conteúdo</title>
<style>
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(__MANROPE_LATIN__) format('woff2'); }
  :root { --cream: #FDFFF8; --ink: #151414; --grey: #5A5A5A; --hair: rgba(21,20,20,.12); --ui: 'Manrope', system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cream); font-family: var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: rgba(253,255,248,.86); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hair); z-index: 5; }
  #topbar .marca { font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
</style>
</head>
<body>
<div id="topbar"><span class="marca">ESCRITÓRIO DE CONTEÚDO</span></div>
<canvas id="scene"></canvas>
<div id="hud"></div>
<!--APP-->
</body>
</html>
